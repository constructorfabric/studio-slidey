# Sidecar for demo_packet.star — authoritative over the script's interface
# (kitsoki internal/host/starlark/schema.go): required inputs are validated
# before eval, and every declared output must be present in main()'s return
# dict.
inputs:
  manifest: { type: string, required: true }
  clips: { type: list, required: true }
outputs:
  ok: { type: bool }
  reasons: { type: list }
  evidence: { type: list }
