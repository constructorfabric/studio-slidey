name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Brackets the supported range (package.json engines: node >=20.19).
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The Puppeteer-backed audit test launches the Chromium that npm ci
      # downloads; ubuntu-latest needs these shared libs for it to start.
      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 xvfb

      - name: Install dependencies
        # --no-audit/--no-fund skip npm's post-install registry calls, which
        # have intermittently hung/crashed `npm ci` on the runners.
        run: npm ci --no-audit --no-fund

      # Full Node suite (builds dist-render so the browser audit test runs)
      # plus the VS Code extension end-to-end suite. Mirrors `make ci` locally.
      - name: Run tests
        run: xvfb-run -a make ci
